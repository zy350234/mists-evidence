<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#080c11"/>
<title>冷到极处的噪声 · 科学推理短篇</title>
<style>
  :root{
    --bg:#080c11; --card:#0e151c; --card2:#0a1016; --line:#1d2a35; --line2:#24404e;
    --ink:#c8d6e0; --dim:#6b8091; --acc:#7fd4c1; --warm:#d9a05b; --bad:#d98b7a; --ok:#8fd694;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);background:radial-gradient(1100px 620px at 50% -12%,#12202b,#080c11 60%);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  }
  .hidden{display:none !important}
  button{font:inherit;color:var(--ink);background:#132029;border:1px solid var(--line);border-radius:10px;
    padding:10px 15px;cursor:pointer;transition:.16s;text-align:left}
  button:hover:not(:disabled){border-color:#2f5a63;color:#eaf3f7}
  button:disabled{opacity:.42;cursor:default}
  button.primary{background:#12312c;border-color:#2b6b5e;color:#d8fff5;font-weight:600}
  button.ghost{background:transparent}
  .wrap{max-width:880px;margin:0 auto;padding:22px 16px 40px}

  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .brand{font-size:13px;letter-spacing:.2em;color:var(--dim)}
  .spacer{flex:1}
  .tgl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
  .tgl input{accent-color:var(--acc);width:15px;height:15px}
  .tgl input[type=range]{width:96px}

  /* ---------- 书架 ---------- */
  h1{font-size:22px;font-weight:600;letter-spacing:.12em;margin:6px 0 6px;color:#eaf3f7}
  .lede{color:var(--dim);font-size:13px;line-height:1.85;margin:0 0 22px;max-width:640px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
  .chapter{display:block;padding:0;overflow:hidden;background:linear-gradient(180deg,var(--card),var(--card2))}
  .chapter:hover:not(.locked){border-color:#2f5a63;transform:translateY(-2px)}
  .chapter .cover{height:118px;background:#070b0f;border-bottom:1px solid var(--line);display:block}
  .chapter .cover svg{width:100%;height:100%;display:block}
  .chapter .body{padding:12px 14px 14px;display:block}
  .chapter .t{display:block;font-size:15px;color:#eaf3f7;font-weight:600;line-height:1.4}
  .chapter .m{display:block;font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.65}
  .chapter .s{display:block;font-size:11.5px;color:var(--acc);margin-top:9px}
  .chapter.locked{opacity:.34;cursor:default}
  .chapter.locked .t{color:var(--dim)}

  /* ---------- 阅读器 ---------- */
  .pbar{height:3px;background:#101a22;border-radius:2px;overflow:hidden;margin-bottom:14px}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#2b6b5e,var(--acc));transition:width .3s}
  .stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:stretch}
  .art{background:#070b0f;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .art svg{width:100%;height:auto;display:block}
  .panel{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px}
  .ptitle{font-size:16px;color:#eaf3f7;font-weight:600;margin:0 0 10px;line-height:1.5}
  .ptext{font-size:14.5px;line-height:1.95;color:var(--ink);margin:0}
  .ptext + .ptext{margin-top:11px}
  .reveal{margin-top:14px;border-left:2px solid var(--line2);padding:2px 0 2px 13px}
  .reveal .rlabel{font-size:11px;letter-spacing:.16em;color:var(--dim)}
  .reveal .rtext{font-size:13.5px;line-height:1.9;margin-top:7px;color:#b6c9d4}
  .ask{font-size:13px;color:var(--warm);letter-spacing:.06em;margin:0 0 10px}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .opt{display:flex;gap:10px;align-items:flex-start;line-height:1.7;font-size:14px;padding:12px 14px}
  .opt .k{color:var(--dim);font-weight:600;flex:0 0 auto}
  .opt.wrong{border-color:#7a4340;color:#e3b0a6;opacity:.75}
  .opt.right{border-color:#2b6b5e;background:#0f2a26;color:#d8fff5}
  .opt.chosen{border-color:#5b6f8a;background:#111d28;color:#dbe7ef}
  .recallbox{margin-top:6px;border:1px solid #2b4756;border-radius:11px;padding:13px 15px;background:#0d151c}
  .recallbox .rlabel{font-size:11px;letter-spacing:.16em;color:var(--dim)}
  .recallbox .rtext{font-size:14px;line-height:1.8;margin-top:7px;color:#dbe7ef}
  .modal{position:fixed;inset:0;background:rgba(3,6,9,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:22px}
  .modalbox{background:#0b1218;border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,94vw)}
  .modalbox h3{margin:0 0 12px;font-size:13px;letter-spacing:.18em;color:var(--dim);font-weight:600}
  .modalbox textarea{width:100%;background:#070b0f;color:#c8d6e0;border:1px solid var(--line);border-radius:10px;
    padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.75;resize:vertical}
  .opt:disabled{opacity:.42}
  .opt.wrong:disabled,.opt.right:disabled{opacity:1}
  .acts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .hintbox{margin-top:14px;font-size:13px;line-height:1.85;color:#c9b28a;border-left:2px solid #5c4a2c;padding-left:13px}
  .feedback{margin-top:14px;border-radius:11px;padding:14px 15px;border:1px solid var(--line);display:none}
  .feedback.show{display:block;animation:rise .28s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .feedback.good{border-color:#2b6b5e;background:#0d211e}
  .feedback.bad{border-color:#6d3b38;background:#1d1113}
  .fb-head{font-size:13px;font-weight:600;letter-spacing:.08em;margin-bottom:8px}
  .feedback.good .fb-head{color:#9fe8cf} .feedback.bad .fb-head{color:#eda99e}
  .fb-body{font-size:13.5px;line-height:1.9;margin:0 0 12px;color:#c3d3dc}

  /* ---------- 底栏 ---------- */
  .status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--dim)}
  .meters{display:flex;align-items:center;gap:7px}
  .meters i{display:block;width:64px;height:4px;background:#16232c;border-radius:2px;overflow:hidden}
  .meters b{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
  .meters .t b{background:var(--warm)}

  /* ---------- 结算 ---------- */
  .score{font-size:64px;font-weight:700;color:#eaf3f7;line-height:1;letter-spacing:-.02em}
  .score small{font-size:15px;color:var(--dim);font-weight:400;margin-left:8px;letter-spacing:.1em}
  .tier{font-size:14px;color:var(--acc);letter-spacing:.2em;margin:10px 0 22px}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl td{padding:9px 4px;border-bottom:1px solid var(--line);color:var(--dim)}
  .tbl td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .clues{margin-top:8px}
  .clue{font-size:13.5px;line-height:1.8;color:#b6c9d4;padding:9px 0;border-bottom:1px solid var(--line)}
  .clue::before{content:"◆ ";color:var(--acc)}

  /* ---------- 线索本 ---------- */
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,92vw);background:#0b1218;border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .28s ease;z-index:40;padding:20px;overflow-y:auto}
  .drawer.open{transform:none}
  .drawer h3{font-size:13px;letter-spacing:.18em;color:var(--dim);margin:0 0 14px}
  .scrim{position:fixed;inset:0;background:rgba(3,6,9,.62);z-index:30;opacity:0;pointer-events:none;transition:.28s}
  .scrim.open{opacity:1;pointer-events:auto}
  #toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#12312c;border:1px solid #2b6b5e;
    color:#d8fff5;padding:11px 18px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:50}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #err{display:none;margin-top:14px;font-size:12px;color:#ffb3a3;white-space:pre-wrap;border:1px solid #6d3b38;
    background:#1d1113;padding:10px 12px;border-radius:10px}
  @media (max-width:720px){ .stage{grid-template-columns:1fr} .score{font-size:52px} }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span class="brand" id="brand">迷雾中的证据</span>
    <span class="spacer"></span>
    <label class="tgl"><input type="checkbox" id="mMusic" checked/>音乐</label>
    <label class="tgl"><input type="checkbox" id="mSfx" checked/>音效</label>
    <label class="tgl">音量<input type="range" id="vol" min="0" max="100" value="78"/></label>
    <label class="tgl"><input type="checkbox" id="mSimple"/>简洁阅读</label>
    <button class="ghost" id="expBtn">导出</button>
    <button class="ghost" id="nbBtn">线索本 <span id="nbCount">0</span></button>
  </div>

  <!-- ============ 书架 ============ -->
  <section id="shelf">
    <h1>迷雾中的证据</h1>
    <p class="lede">按真实发现过程写成的中文字科推理短篇。每页只推进一件事；在转折处，根据当时掌握的证据选一个最佳答案。
      答错可以先看解释再重新作答，看提示会降低本题得分。全部配乐与音效由浏览器实时合成，页面内没有音频文件。</p>
    <div class="grid" id="shelfGrid"></div>
  </section>

  <!-- ============ 阅读器 ============ -->
  <section id="reader" class="hidden">
    <div class="pbar"><i id="pbar"></i></div>
    <div class="stage">
      <div class="art" id="art"></div>
      <div class="panel">
        <div id="panelBody"></div>
      </div>
    </div>
    <div class="status">
      <span id="pageInfo"></span>
      <span class="spacer"></span>
      <span class="meters" title="配乐会随线索推进变亮、随连续答错变得压迫">
        明度<i><b id="mBright"></b></i>
      </span>
      <span class="meters t">张力<i><b id="mTens"></b></i></span>
      <button class="ghost" id="quitBtn" style="padding:5px 11px">返回书架</button>
    </div>
    <div id="err"></div>
  </section>

  <!-- ============ 结算 ============ -->
  <section id="result" class="hidden">
    <div class="panel" id="resultBody"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <h3>线 索 本</h3>
  <div id="drawerBody"></div>
</aside>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================================
   1 · 章节数据
   ========================================================================== */
const CHAPTERS = [
{
  id: "cmb",
  title: "冷到极处的噪声",
  domain: "天体物理 · 精密测量",
  difficulty: 3,
  minutes: "20–25",
  ability: "排除竞争解释",
  cover: "horn",
  pages: [
    {
      type: "story", art: "horn",
      title: "1964 年春 · 新泽西州克劳福德山",
      text: [
        "贝尔实验室有一台 20 英尺的喇叭形天线，原本用于卫星通信，后来交给射电天文使用。",
        "阿诺·彭齐亚斯和罗伯特·威尔逊把它对准天空，准备测量银河系外的射电源。动手之前，他们先做一件更基本的功课：把仪器自身的本底噪声测清楚。",
        "结果他们测到一段多余的噪声——等效天线温度比预期高出大约 3.5 K。"
      ],
      reveal: {
        label: "测量记录",
        text: "频率 4080 MHz，波长 7.35 厘米。3.5 K 不是「天线有 3.5 度热」，而是把多余的功率折算成一句话：如果这是一个热源发出的，它该有多热。"
      }
    },
    {
      type: "question", qid: "q1", art: "noise",
      title: "多出来的 3.5 K",
      text: ["读数比预期高出一段无法解释的噪声。在把它当成新发现之前，还有一件更基本的功课要做。"],
      options: [
        { t: "先宣布：天空中存在一种未知的射电辐射。",
          why: "宣布之前，没有任何证据表明它来自天空。噪声同样可能来自地面、大气或仪器本身。先命名，等于把最需要检验的假设当成了结论。" },
        { t: "先假定毛病出在自己这套设备上，逐项检查接收机与天线。", ok: true,
          why: "这是当时最合理的下一步：任何「来自天空」的解释，都要求先排除仪器、地面、大气这些更近的来源。彭齐亚斯和威尔逊正是从这里开始的。" },
        { t: "换一个完全不同的频段重测，绕开这个读数。",
          why: "换频段能得到新信息，但它解释不了已经测到的这段噪声。在原因不明时换掉证据，等于把问题推走。" }
      ],
      clue: "第一步永远是先怀疑自己：把「来自天空」留到排除仪器之后。",
      hint: "想一想：如果噪声来自接收机自身的电子学，或者来自地面与大气，读数会随什么变化？"
    },
    {
      type: "story", art: "rack",
      title: "把设备拆到不能再拆",
      text: [
        "他们检查了接收机的每个接头，重新焊接可疑的焊点，用液氮把前端冷却到更低温度，甚至爬进天线里检查铆钉。",
        "所有能想到的仪器原因都排除之后，那段噪声还在，而且大小几乎没变。"
      ],
      reveal: {
        label: "当时已经能确认的三件事",
        text: "噪声与天线的指向无关，与一天中的时间无关，也与季节无关。这三点当时只是「无法解释」，后来却成了整个解释最关键的支点。"
      }
    },
    {
      type: "question", qid: "q2", art: "sky",
      title: "如果是干扰，它必须留下痕迹",
      text: ["有人提出：也许是纽约市的无线电干扰，或者是附近的雷达。要检验「噪声来自某个方向」这个解释，最有力的做法是什么？"],
      options: [
        { t: "把天线指向不同方向，比较读数有没有变化。", ok: true,
          why: "如果噪声来自某个具体的地面源，天线指向改变时，强度必然改变。指向哪里都一样强，方向性干扰就被排除了——这是最直接、最便宜、也最容易重复的检验。" },
        { t: "请理论家先算一算，这座大城市应该产生多强的干扰。",
          why: "计算给出的是预期范围，不能替代实测。城市干扰的强度依赖太多未知量，算出来的区间宽到无法判定，既不能证实也不能证伪。" },
        { t: "把整套设备搬到几百公里外的安静地点，重测一遍。",
          why: "搬迁代价极大，而且在原地点就能先做的判别性检验（改变指向）还没有做。先做最便宜、最能分清是非的那一个。" }
      ],
      clue: "竞争解释必须给出可检验的差别：来源有方向，噪声就该随方向变化。",
      hint: "问自己：什么样的观测结果，能把这个解释判死？"
    },
    {
      type: "poll", pid: "cmb-poll", art: "noise",
      title: "先留下你此刻的判断",
      text: ["按你现在掌握的信息，你觉得这段噪声更可能来自哪里？"],
      options: [
        { t: "接收机本身，或者天线附近的地面。" },
        { t: "大气层里的某种效应。" },
        { t: "天空本身——一种还没有被认识的辐射。" }
      ]
    },
    {
      type: "story", art: "pigeon",
      title: "天线口里住着两只鸽子",
      text: [
        "检查过程中他们发现，喇叭口的缝隙里筑了巢，里面有一对鸽子，还有一层被彭齐亚斯在演讲中称为「白色电介质材料」的东西。",
        "他们清理了天线，把鸽子装进箱子送走，又测了一遍。",
        "噪声一点没有变。"
      ],
      reveal: {
        label: "这一步的价值",
        text: "排除一个解释，靠的不是「我觉得不可能」，而是它做出过预测、并且预测失败了。污物若真是来源，清理之后读数必须下降。"
      }
    },
    {
      type: "question", qid: "q3", art: "noise",
      title: "为什么「白忙一场」也是进展",
      text: ["清理鸽子没有改变读数。为什么这仍然是重要的一步？"],
      options: [
        { t: "因为它把「污物造成噪声」这个解释真正排除掉了，来源只能在更远的地方。", ok: true,
          why: "一次失败的预测同样是有用的信息：它缩小了可能性的集合。剩下的解释还必须额外说明——为什么噪声在所有方向、所有季节、清理前后都完全一样。" },
        { t: "因为这说明天线的卫生无关紧要，以后不必再管。",
          why: "结论被过度推广了。它排除的只是「这一次的污物是主因」，推不出天线维护不重要。把一次具体结论扩成一般规律，是常见的推理错误。" },
        { t: "因为这说明整套测量设备坏了，读数不可信。",
          why: "恰恰相反：设备经过彻底检查后读数依然稳定、可重复，正是这份稳定让后面的解释站得住脚。" }
      ],
      clue: "被排除的解释不是白费：每排除一个，剩下的解释就必须解释更多。",
      hint: "把「清理前后读数不变」当成一次实验的结果来看，它告诉了你什么？"
    },
    {
      type: "story", art: "princeton",
      title: "一次电话",
      text: [
        "1965 年，彭齐亚斯把这段噪声讲给同事伯纳德·伯克听。伯克想起普林斯顿的罗伯特·迪克小组正在准备一个实验：寻找宇宙曾经极热致密所残留的辐射。",
        "彭齐亚斯给迪克打了电话。迪克听完，把结果转告了自己的小组。"
      ],
      reveal: {
        label: "转述，不是逐字记录",
        text: "迪克那句常被引用的「我们被抢先了」，来自当事人的事后回忆，不是当时的录音或文字记录。这里保留它，是因为它传神，而不是因为它逐字可靠。"
      }
    },
    {
      type: "question", qid: "q4", art: "letter",
      title: "为什么普林斯顿能立刻解释",
      text: ["迪克小组听到这个数字后，很快给出了物理解释。他们凭什么？"],
      options: [
        { t: "他们自己的探测器已经测到了同样强度的噪声。",
          why: "他们当时还在准备阶段，并没有这份测量结果。先有测量、后有解释，顺序正好相反。" },
        { t: "他们事先从理论上算过：如果宇宙曾经极热极密，今天就应该剩下一层各向同性的低温辐射。", ok: true,

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

function makeImpulse(ctx, seconds, decay) {
  seconds = seconds || 3.4; decay = decay || 2.4;
  const rate = ctx.sampleRate, len = Math.max(1, Math.floor(rate * seconds));
  const buf = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) { const t = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay); }
  }
  return buf;
}
function makeNoise(ctx, seconds) {
  const rate = ctx.sampleRate, len = Math.max(1, Math.floor(rate * (seconds || 4)));
  const buf = ctx.createBuffer(1, len, rate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

const PROG = [
  { name:"i",  root:50, notes:[50,53,57,62] },
  { name:"i",  root:50, notes:[50,53,57,62] },
  { name:"VI", root:46, notes:[46,50,53,58] },
  { name:"V",  root:45, notes:[45,49,52,57] }
];
const MELODY = [62,65,67,69,72,74,77,79];

class ColdScore {
  constructor(ctx, out, opts) {
    opts = opts || {};
    this.ctx = ctx;
    this.bpm = opts.bpm || 62;
    this.beat = 60 / this.bpm;
    this.bar = this.beat * 4;
    this.playing = false;
    this.sources = [];
    this.mood = { brightness: 0.30, tension: 0.55 };
    this.moodTarget = { brightness: 0.30, tension: 0.55 };
    this.glideK = 0.02;
    this._lastDrone = -1;

    this.bus = ctx.createGain(); this.bus.gain.value = 1; this.bus.connect(out);
    this.dry = ctx.createGain(); this.dry.gain.value = 0.9; this.dry.connect(this.bus);
    const damp = ctx.createBiquadFilter(); damp.type = "lowpass"; damp.frequency.value = 2000;
    this.conv = ctx.createConvolver(); this.conv.buffer = makeImpulse(ctx);
    this.verbSend = ctx.createGain(); this.verbSend.gain.value = 0.55;
    const verbOut = ctx.createGain(); verbOut.gain.value = 0.85;
    this.verbSend.connect(damp).connect(this.conv).connect(verbOut).connect(this.bus);
  }
  send(node, amount) { const g = this.ctx.createGain(); g.gain.value = amount; node.connect(g).connect(this.verbSend); }
  getChord(bar) { return PROG[Math.floor(bar / 2) % PROG.length]; }

  setMood(target, glide) {
    glide = Math.max(0.5, glide || 4);
    this.moodTarget = { brightness: clamp01(target.brightness), tension: clamp01(target.tension) };
    this.glideK = 1 - Math.exp(-0.055 / glide);
  }

  startVoices(t0) {
    const ctx = this.ctx;
    const droneGain = this.droneGain = ctx.createGain();
    droneGain.gain.setValueAtTime(0.0001, t0);
    droneGain.gain.linearRampToValueAtTime(0.045 + this.mood.tension * 0.085, t0 + 4);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 260; lp.Q.value = 4;
    this.droneLP = lp;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.031;
    const lfoAmt = ctx.createGain(); lfoAmt.gain.value = 110;
    lfo.connect(lfoAmt).connect(lp.frequency); lfo.start(t0);
    this.sources.push(lfo);
    [38, 50].forEach((m, i) => {
      const o = ctx.createOscillator(); o.type = "sawtooth";
      o.frequency.value = mtof(m); o.detune.value = i ? 7 : -8;
      o.connect(lp); o.start(t0); this.sources.push(o);
    });
    lp.connect(droneGain); droneGain.connect(this.dry); this.send(droneGain, 0.3);

    const windGain = this.windGain = ctx.createGain();
    windGain.gain.value = 0.006 + this.mood.tension * 0.012;
    const src = ctx.createBufferSource(); src.buffer = makeNoise(ctx, 4); src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 700; bp.Q.value = 1.1;
    const w1 = ctx.createOscillator(); w1.frequency.value = 0.017;
    const wa1 = ctx.createGain(); wa1.gain.value = 420;
    w1.connect(wa1).connect(bp.frequency); w1.start(t0);
    const w2 = ctx.createOscillator(); w2.frequency.value = 0.011;
    const wa2 = ctx.createGain(); wa2.gain.value = 0.006;
    w2.connect(wa2).connect(windGain.gain); w2.start(t0);
    this.sources.push(src, w1, w2);
    src.connect(bp).connect(windGain); windGain.connect(this.dry); this.send(windGain, 0.5);
  }

  pad(t, notes, dur) {
    const ctx = this.ctx, br = this.mood.brightness;
    const all = br > 0.55 ? notes.concat([notes[notes.length - 1] + 12]) : notes;
    all.forEach((m, i) => {
      const o = ctx.createOscillator();
      o.type = i % 2 ? "sawtooth" : "triangle";
      o.frequency.value = mtof(m); o.detune.value = Math.random() * 16 - 8;
      const f = ctx.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = 420 + br * 1500 + i * 70; f.Q.value = 0.8;
      const g = ctx.createGain();
      const peak = (0.035 + br * 0.030) / (1 + i * 0.55);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + 2.6);
      g.gain.setValueAtTime(peak, t + dur - 1.8);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(f).connect(g); g.connect(this.dry); this.send(g, 0.6);
      o.start(t); o.stop(t + dur + 0.1);
    });
  }
  pizz(t, m, vel) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = mtof(m);
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 3;
    f.frequency.setValueAtTime(1100, t); f.frequency.exponentialRampToValueAtTime(170, t + 0.4);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    o.connect(f).connect(g); g.connect(this.dry); this.send(g, 0.45);
    o.start(t); o.stop(t + 0.7);
  }
  melody(t, m, vel) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = mtof(m);
    const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = mtof(m) * 2.005;
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel, t + 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    o.connect(g); o2.connect(g2).connect(g); g.connect(this.dry); this.send(g, 1.0);
    o.start(t); o.stop(t + 3.4); o2.start(t); o2.stop(t + 3.4);
  }
  bell(t, m, vel) {
    const ctx = this.ctx;
    [1, 2.01, 2.98, 4.1].forEach((mult, i) => {
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = mtof(m) * mult;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel / (1 + i * 1.7), t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 4.6 / (1 + i * 0.35));
      o.connect(g); g.connect(this.dry); this.send(g, 1.1);
      o.start(t); o.stop(t + 5);
    });
  }
  thump(t, vel) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(mtof(45), t);
    o.frequency.exponentialRampToValueAtTime(mtof(33), t + 0.28);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g); g.connect(this.dry);
    o.start(t); o.stop(t + 0.6);
  }

  scheduleBar(bar, t) {
    const ch = this.getChord(bar), br = this.mood.brightness, te = this.mood.tension;
    if (bar % 2 === 0) this.pad(t, ch.notes, 2 * this.bar + 1.6);
    this.pizz(t, ch.root - 12 >= 26 ? ch.root - 12 : ch.root, 0.12 + br * 0.05);
    if (Math.random() < 0.30 + br * 0.35) this.pizz(t + 2 * this.beat, ch.root, 0.085);
    if (Math.random() < 0.28 + br * 0.45) {
      const when = t + this.beat * Math.floor(Math.random() * 4);
      this.melody(when, MELODY[Math.floor(Math.random() * MELODY.length)], 0.022 + br * 0.016);
    }
    if (bar % 3 === 2 && Math.random() < 0.35 + br * 0.55)
      this.bell(t + this.beat * 2, ch.notes[ch.notes.length - 1] + 12, 0.018 + br * 0.045);
    const hb = te > 0.78 ? 2 : (te > 0.6 ? 3 : 4);
    if (bar % hb === 0) { this.thump(t, 0.06 + te * 0.10); this.thump(t + 0.42, 0.04 + te * 0.06); }
  }

  tick() {
    const m = this.mood, tg = this.moodTarget, k = this.glideK;
    m.brightness += (tg.brightness - m.brightness) * k;
    m.tension += (tg.tension - m.tension) * k;
    if (Math.abs(m.tension - this._lastDrone) > 0.012) {
      this._lastDrone = m.tension;
      const now = this.ctx.currentTime;
      if (this.droneGain) this.droneGain.gain.setTargetAtTime(0.045 + m.tension * 0.085, now, 0.8);
      if (this.windGain) this.windGain.gain.setTargetAtTime(0.006 + m.tension * 0.012, now, 0.8);
      if (this.droneLP) this.droneLP.frequency.setTargetAtTime(210 + m.tension * 150, now, 1.2);
    }
    const now = this.ctx.currentTime;
    while (this.nextBarTime < now + 0.4) {
      this.scheduleBar(this.barIndex, this.nextBarTime);
      this.barIndex++;
      this.nextBarTime += this.bar;
    }
  }

  start() {
    const ctx = this.ctx;
    if (ctx.state === "suspended") ctx.resume();
    const t0 = ctx.currentTime + 0.08;
    this.t0 = t0; this.barIndex = 0; this.nextBarTime = t0; this.playing = true; this.sources = [];
    this.bus.gain.cancelScheduledValues(ctx.currentTime);
    this.bus.gain.setValueAtTime(Math.max(this.bus.gain.value, 0.0001), ctx.currentTime);
    this.bus.gain.linearRampToValueAtTime(1, t0 + 1.5);
    this.startVoices(t0);
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), 55);
    this.tick();
  }
  stop() {
    const ctx = this.ctx, t = ctx.currentTime;
    this.playing = false;
    clearInterval(this.timer);
    this.bus.gain.cancelScheduledValues(t);
    this.bus.gain.setValueAtTime(Math.max(this.bus.gain.value, 0.0001), t);
    this.bus.gain.linearRampToValueAtTime(0.0001, t + 1.2);
    this.sources.forEach(s => { try { s.stop(t + 1.3); } catch (e) {} });
    this.sources = [];
  }
  /* 额外的一次性低音下坠，用于答错 */
  sink(t) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(mtof(41), t);
    o.frequency.exponentialRampToValueAtTime(mtof(29), t + 1.4);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.16, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    o.connect(g); g.connect(this.dry); this.send(g, 0.5);
    o.start(t); o.stop(t + 2);
  }
  /* 额外的一次性高音亮起，用于答对 / 得到线索 */
  lift(t, m) {
    const ctx = this.ctx;
    [0, 7].forEach((iv, i) => {
      const o = ctx.createOscillator(); o.type = "triangle";
      o.frequency.value = mtof((m || 74) + iv);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t + i * 0.09);
      g.gain.linearRampToValueAtTime(0.05 / (1 + i * 0.7), t + i * 0.09 + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 2.4);
      o.connect(g); g.connect(this.dry); this.send(g, 1.0);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 2.6);
    });
  }
}

   4 · 音效

class Sfx {
  constructor(ctx, out) {
    this.ctx = ctx; this.out = out;
    this.noise = makeNoise(ctx, 2);
    this.conv = ctx.createConvolver(); this.conv.buffer = makeImpulse(ctx, 2.2, 3);
    this.send = ctx.createGain(); this.send.gain.value = 0.32;
    this.send.connect(this.conv).connect(out);
  }
  env(g, t, vel, attack, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  tone(t, m, dur, type, vel, rev) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = mtof(m);
    const g = ctx.createGain(); this.env(g, t, vel, 0.012, dur);
    o.connect(g); g.connect(this.out);
    const s = ctx.createGain(); s.gain.value = rev; g.connect(s).connect(this.send);
    o.start(t); o.stop(t + dur + 0.05);
  }
  noiseHit(t, f0, f1, q, vel, dur) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource(); src.buffer = this.noise;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); this.env(g, t, vel, 0.006, dur);
    src.connect(f).connect(g); g.connect(this.out);
    const s = ctx.createGain(); s.gain.value = 0.4; g.connect(s).connect(this.send);
    src.start(t); src.stop(t + dur + 0.05);
  }
  correct(t) { this.tone(t, 69, 1.1, "triangle", 0.13, 0.55); this.tone(t + 0.10, 76, 1.5, "triangle", 0.12, 0.75); this.tone(t + 0.10, 88, 0.9, "sine", 0.045, 1.0); }
  wrong(t) { this.tone(t, 50, 0.85, "sawtooth", 0.10, 0.35); this.tone(t + 0.015, 49, 0.9, "sawtooth", 0.09, 0.35); this.noiseHit(t, 900, 220, 1.0, 0.10, 0.30); }
  page(t) { this.noiseHit(t, 2200, 620, 1.4, 0.09, 0.17); }
  clue(t) { this.tone(t, 88, 2.6, "sine", 0.085, 1.2); this.tone(t + 0.09, 95, 2.2, "sine", 0.06, 1.2); this.tone(t + 0.09, 100, 1.6, "sine", 0.028, 1.0); }
  reveal(t) { this.noiseHit(t, 1500, 3400, 1.1, 0.07, 0.5); this.tone(t + 0.02, 81, 1.6, "sine", 0.04, 1.0); }
  pick(t) { this.tone(t, 62, 1.5, "triangle", 0.075, 0.9); this.tone(t + 0.09, 67, 1.7, "triangle", 0.055, 0.95); }
  finish(t) { [62, 69, 74, 81].forEach((m, i) => this.tone(t + i * 0.16, m, 2.6 - i * 0.2, "triangle", 0.10, 1.0)); }
}

const Audio_ = {
  prefs: { music: true, sfx: true, volume: 0.78, simple: false },
  base: { brightness: 0.30, tension: 0.55 },
  ready: false,
  init() {
    if (this.ready) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = this.ctx = new AC();
    window.__ctx = ctx;
    this.master = ctx.createGain(); this.master.gain.value = this.prefs.volume;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = 0.005; comp.release.value = 0.26;
    this.analyser = ctx.createAnalyser(); this.analyser.fftSize = 1024;
    this.master.connect(comp).connect(this.analyser).connect(ctx.destination);
    this.musicGain = ctx.createGain(); this.musicGain.gain.value = this.prefs.music ? 0.85 : 0.0001;
    this.musicGain.connect(this.master);
    this.sfxGain = ctx.createGain(); this.sfxGain.gain.value = this.prefs.sfx ? 0.9 : 0.0001;
    this.sfxGain.connect(this.master);
    this.score = new ColdScore(ctx, this.musicGain, { bpm: 62 });
    this.sfx = new Sfx(ctx, this.sfxGain);
    this.ready = true;
  },
  startMusic() { this.init(); if (!this.score.playing) this.score.start(); },
  setBase(b) { this.base = b; this.score.setMood(b, 6); },
  at() { return this.ctx.currentTime + 0.02; },
  onPage() { if (this.ready) this.sfx.page(this.at()); },
  onReveal() { if (this.ready) this.sfx.reveal(this.at()); },
  onPick() {
    if (!this.ready) return;
    this.sfx.pick(this.at());
    const b = { brightness: this.base.brightness + 0.05, tension: this.base.tension - 0.05 };
    this.score.setMood(b, 3);
    clearTimeout(this._t3);
    this._t3 = setTimeout(() => this.score.setMood(this.base, 6), 6000);
  },
  onCorrect(points) {
    if (!this.ready) return;
    this.sfx.correct(this.at());
    this.score.lift(this.at(), points >= 100 ? 76 : 72);
    const b = { brightness: this.base.brightness + (points >= 100 ? 0.22 : 0.13), tension: this.base.tension - 0.14 };
    this.score.setMood(b, 1.2);
    clearTimeout(this._t1);
    this._t1 = setTimeout(() => this.score.setMood(this.base, 7), 7000);
  },
  onWrong() {
    if (!this.ready) return;
    this.sfx.wrong(this.at());
    this.score.sink(this.at());
    const b = { brightness: this.base.brightness - 0.14, tension: this.base.tension + 0.24 };
    this.score.setMood(b, 0.8);
    clearTimeout(this._t2);
    this._t2 = setTimeout(() => this.score.setMood(this.base, 6), 9000);
  },
  onClue() {
    if (!this.ready) return;
    this.sfx.clue(this.at());
    const b = { brightness: this.base.brightness + 0.12, tension: this.base.tension - 0.08 };
    this.score.setMood(b, 2.5);
    clearTimeout(this._t2);
    this._t2 = setTimeout(() => this.score.setMood(this.base, 6), 9000);
  },
  onFinish() {
    if (!this.ready) return;
    this.sfx.finish(this.at());
    this.score.setMood({ brightness: 0.85, tension: 0.22 }, 6);
  },
  mood() { return this.ready ? this.score.mood : { brightness: 0, tension: 0 }; }
};

/* ============================================================================
   6 · 进度存档
   ========================================================================== */
const PKEY = "mists-evidence-v1";
const AKEY = "mists-audio-v1";
function loadAll() { try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { return {}; } }
function saveState(st) {
  try { const all = loadAll(); all[st.chapterId] = st; localStorage.setItem(PKEY, JSON.stringify(all)); return true; }
  catch (e) { return false; }
}
function loadState(id) { return loadAll()[id] || null; }
function loadPrefs() { try { return JSON.parse(localStorage.getItem(AKEY)) || null; } catch (e) { return null; } }
function savePrefs(p) { try { localStorage.setItem(AKEY, JSON.stringify(p)); } catch (e) {} }

/* ============================================================================
   7 · 应用
   ========================================================================== */
const $ = s => document.querySelector(s);
let state = null;

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function showError(msg) { const e = $("#err"); e.style.display = "block"; e.textContent = String(msg); }
window.addEventListener("error", ev => showError("运行错误：" + ev.message));

function chapter() { return CHAPTERS.find(c => c.id === state.chapterId); }
function page() { return chapter().pages[state.index]; }

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
function showScreen(id) {
  ["shelf", "reader", "result"].forEach(s => $("#" + s).classList.toggle("hidden", s !== id));
  $("#brand").textContent = id === "shelf" ? "科学推理短篇 · 六关" : chapter().title;
}

/* ---------- 书架 ---------- */
function renderShelf() {
  const g = $("#shelfGrid"); g.innerHTML = "";
  CHAPTERS.forEach(ch => {
    const saved = loadState(ch.id);
    const b = el("button", "chapter");
    const st = saved ? (saved.done ? "已通关 · " + saved.score + " 分（可重做）" : "进行中 · 第 " + (saved.index + 1) + " / " + ch.pages.length + " 页") : "未开始";
    b.innerHTML = '<span class="cover">' + svgWrap(ART[ch.cover]()) + "</span>"
      + '<span class="body"><span class="t">' + ch.title + "</span>"
      + '<span class="m">' + ch.domain + " · 难度 " + ch.difficulty + "/5 · 约 " + ch.minutes + " 分钟<br/>核心能力：" + ch.ability + "</span>"
      + '<span class="s">' + st + "</span></span>";
    b.onclick = () => startChapter(ch.id, saved && !saved.done ? saved : null);
    g.appendChild(b);
  });
  const lock = el("div", "chapter locked");
  lock.innerHTML = '<span class="cover">' + svgWrap(grid() + stars() + T(320,180,"待 添 加",{anchor:"middle",size:16,fill:C.dim,ls:6})) + "</span>"
    + '<span class="body"><span class="t">后续关卡</span><span class="m">同一套引擎，换一份数据即可成关</span></span>';
  g.appendChild(lock);
}

/* ---------- 进入章节 ---------- */
function normalize(st) {
  if (!st.answers) st.answers = {};
  if (!st.polls) st.polls = {};
  if (!st.clues) st.clues = [];
  if (typeof st.simple !== "boolean") st.simple = false;
  return st;
}
function startChapter(id, saved) {
  if (saved) state = normalize(saved);
  else state = { chapterId: id, index: 0, answers: {}, polls: {}, clues: [], done: false, score: 0, simple: Audio_.prefs.simple };
  showScreen("reader");
  Audio_.init();
  Audio_.startMusic();
  updateBase();
  renderPage(true);
}
function updateBase() {
  const ch = chapter();
  const total = ch.pages.filter(p => p.type === "question").length;
  const solved = Object.values(state.answers).filter(a => a.solved).length;
  const prog = total ? solved / total : 0;
  Audio_.setBase({ brightness: 0.26 + prog * 0.40, tension: 0.62 - prog * 0.26 });
}

/* ---------- 渲染一页 ---------- */
function renderPage(first) {
  const ch = chapter(), p = page();
  $("#pbar").style.width = Math.round((state.index / ch.pages.length) * 100) + "%";
  $("#pageInfo").textContent = ch.title + " · 第 " + (state.index + 1) + " / " + ch.pages.length + " 页";
  $("#art").innerHTML = svgWrap((ART[p.art] || ART.fireball)());
  const body = $("#panelBody"); body.innerHTML = "";
  const f = $("#feedbackSlot"); if (f) f.remove();
  if (p.title) body.appendChild(el("h2", "ptitle", p.title));
  (p.text || []).forEach(t => body.appendChild(el("p", "ptext", t)));

  if (p.reveal) {
    const box = el("div", "reveal");
    const html = '<div class="rlabel">' + p.reveal.label + '</div><div class="rtext">' + p.reveal.text + "</div>";
    if (state.simple) {
      box.innerHTML = html;
      body.appendChild(box);
    } else {
      const btn = el("button", "ghost", "翻开记录");
      btn.onclick = () => { Audio_.onReveal(); box.innerHTML = html; };
      box.appendChild(btn);
      body.appendChild(box);
    }
  }

  const opts = el("div", "opts");
  const acts = el("div", "acts");
  const lastPage = state.index === ch.pages.length - 1;
  const contBtn = () => {
    const nb = el("button", "primary", lastPage ? "查看成绩 →" : "继续 →");
    nb.onclick = () => nextPage();
    return nb;
  };

  if (p.type === "question") {
    body.appendChild(el("p", "ask", "从当时掌握的证据看，哪一个是最佳选择？"));
    const rec = state.answers[p.qid] || (state.answers[p.qid] = { tries: 0, hint: false, solved: false, points: 0 });
    p.options.forEach((o, i) => {
      const b = el("button", "opt");
      b.innerHTML = '<span class="k">' + "ABC"[i] + '</span><span>' + o.t + "</span>";
      b.onclick = () => answer(i, b);
      if (rec.solved) { b.disabled = true; if (o.ok) b.classList.add("right"); }
      opts.appendChild(b);
    });
    if (!rec.solved) {
      const hb = el("button", "ghost", "看提示（本题最高 30 分）");
      hb.onclick = () => {
        rec.hint = true;
        hb.remove();
        const h = el("div", "hintbox", "提示：" + p.hint);
        body.insertBefore(h, opts);
      };
      acts.appendChild(hb);
    } else {
      acts.appendChild(contBtn());
    }
  } else if (p.type === "poll") {
    body.appendChild(el("p", "ask", "不计分 · 先留下你此刻的想法，不必猜中后来发生了什么"));
    const rec = state.polls[p.pid] || (state.polls[p.pid] = { choice: -1 });
    p.options.forEach((o, i) => {
      const b = el("button", "opt");
      b.innerHTML = '<span class="k">' + "ABC"[i] + '</span><span>' + o.t + "</span>";
      if (rec.choice === i) b.classList.add("chosen");
      if (rec.choice >= 0) b.disabled = true;
      b.onclick = () => {
        if (rec.choice >= 0) return;
        rec.choice = i;
        b.classList.add("chosen");
        opts.querySelectorAll(".opt").forEach(x => { x.disabled = true; });
        Audio_.onPick();
        acts.innerHTML = ""; acts.appendChild(contBtn());
        saveState(state);
      };
      opts.appendChild(b);
    });
    if (rec.choice >= 0) acts.appendChild(contBtn());
  } else if (p.type === "recall") {
    const poll = ch.pages.find(x => x.type === "poll" && x.pid === p.pid);
    const rec = state.polls[p.pid];
    const box = el("div", "recallbox");
    box.innerHTML = '<div class="rlabel">你当时的选择</div><div class="rtext">'
      + (rec && rec.choice >= 0 && poll ? poll.options[rec.choice].t : "（当时跳过了这一问）") + "</div>";
    body.appendChild(box);
    acts.appendChild(contBtn());
  } else {
    acts.appendChild(contBtn());
  }
  body.appendChild(opts);
  body.appendChild(acts);
  const fb = el("div", "feedback"); fb.id = "feedbackSlot"; body.appendChild(fb);
  updateStatus();
  saveState(state);
  if (!first) Audio_.onPage();
}

function answer(i, btn) {
  const p = page();
  const rec = state.answers[p.qid];
  if (rec.solved) return;
  const o = p.options[i];
  rec.tries++;
  if (o.ok) {
    rec.solved = true;
    rec.points = rec.hint ? 30 : (rec.tries === 1 ? 100 : 60);
    btn.classList.add("right");
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; });
    document.querySelectorAll("#panelBody .acts button.ghost").forEach(x => x.remove());
    let gained = false;
    if (p.clue && state.clues.indexOf(p.clue) === -1) { state.clues.push(p.clue); gained = true; }
    Audio_.onCorrect(rec.points);
    if (gained) { Audio_.onClue(); toast("线索已收入线索本"); }
    feedback(true, o.why, () => { nextPage(); });
  } else {
    btn.classList.add("wrong"); btn.disabled = true;
    Audio_.onWrong();
    feedback(false, o.why, null);
  }
  updateBase();
  updateStatus();
  saveState(state);
}

function feedback(ok, why, onContinue) {
  const f = $("#feedbackSlot");
  f.className = "feedback show " + (ok ? "good" : "bad");
  f.innerHTML = "";
  f.appendChild(el("div", "fb-head", ok ? "✓ 这就是当时最合理的下一步" : "✕ 这个选择与当时掌握的证据对不上"));
  f.appendChild(el("p", "fb-body", why));
  const b = el("button", "primary", ok ? "继续 →" : "重新作答");
  b.onclick = () => {
    if (ok) { onContinue(); }
    else { f.className = "feedback"; f.innerHTML = ""; document.querySelectorAll(".opt").forEach(x => { if (!x.classList.contains("wrong")) x.disabled = false; }); }
  };
  f.appendChild(b);
}

function nextPage() {
  const ch = chapter();
  if (state.index >= ch.pages.length - 1) { finish(); return; }
  let i = state.index + 1;
  if (state.simple) {
    while (i < ch.pages.length - 1 && (ch.pages[i].type === "poll" || ch.pages[i].type === "recall")) i++;
  }
  state.index = i;
  saveState(state);
  renderPage(false);
}

/* ---------- status / 线索本 ---------- */
function updateStatus() {
  $("#nbCount").textContent = state.clues.length;
  renderDrawer();
}
function renderDrawer() {
  const b = $("#drawerBody"); b.innerHTML = "";
  if (!state || !state.clues.length) { b.appendChild(el("div", "clue", "还没有线索。答对关键题目会自动收入。")); return; }
  state.clues.forEach(c => b.appendChild(el("div", "clue", c)));
}
function openDrawer(v) { $("#drawer").classList.toggle("open", v); $("#scrim").classList.toggle("open", v); }

/* ---------- 结算 ---------- */
function finish() {
  const ch = chapter();
  const qs = ch.pages.filter(p => p.type === "question");
  let sum = 0, first = 0, fixed = 0, hinted = 0, missed = 0;
  qs.forEach(p => {
    const r = state.answers[p.qid] || { points: 0, tries: 0, hint: false, solved: false };
    sum += r.points;
    if (!r.solved) missed++;
    else if (r.hint) hinted++;
    else if (r.tries === 1) first++;
    else fixed++;
  });
  const score = Math.round(sum / Math.max(1, qs.length));
  state.done = true; state.score = score;
  saveState(state);
  Audio_.onFinish();
  const tier = score >= 90 ? "优秀 · 证据链完整" : score >= 75 ? "良好 · 少数环节可以更谨慎" : score >= 60 ? "合格 · 建议回看错过的推理" : "继续探索 · 重点回看提示";

  const b = $("#resultBody"); b.innerHTML = "";
  b.innerHTML = '<div class="score">' + score + '<small>/ 100</small></div><div class="tier">' + tier + "</div>"
    + '<table class="tbl">'
    + "<tr><td>首次独立答对</td><td>" + first + " 题 × 100%</td></tr>"
    + "<tr><td>纠错后答对</td><td>" + fixed + " 题 × 60%</td></tr>"
    + "<tr><td>借助提示掌握</td><td>" + hinted + " 题 × 30%</td></tr>"
    + "<tr><td>仍未解决</td><td>" + missed + " 题</td></tr>"
    + "<tr><td>收集线索</td><td>" + state.clues.length + " 条</td></tr>"
    + "</table>";
  const h = el("h2", "ptitle", "值得回看的推理");
  h.style.marginTop = "22px";
  b.appendChild(h);
  const cl = el("div", "clues");
  state.clues.forEach(c => cl.appendChild(el("div", "clue", c)));
  b.appendChild(cl);
  const acts = el("div", "acts");
  const a1 = el("button", "primary", "返回书架");
  a1.onclick = () => { renderShelf(); showScreen("shelf"); };
  const a2 = el("button", "ghost", "重做本关");
  a2.onclick = () => startChapter(state.chapterId, null);
  const a3 = el("button", "ghost", "导出成绩与线索");
  a3.onclick = () => showExport();
  acts.appendChild(a1); acts.appendChild(a2); acts.appendChild(a3);
  b.appendChild(acts);
  showScreen("result");
}

/* ---------- 成绩导出 ---------- */
function exportText() {
  const ch = chapter();
  const qs = ch.pages.filter(p => p.type === "question");
  const lines = ["《" + ch.title + "》成绩与线索", "得分：" + state.score + " / 100", ""];
  qs.forEach((p, i) => {
    const r = state.answers[p.qid] || {};
    const label = !r.solved ? "未解决" : r.hint ? "借助提示掌握" : (r.tries === 1 ? "首次独立答对" : "纠错后答对");
    lines.push("第 " + (i + 1) + " 题　" + label + "（" + (r.points || 0) + " 分）");
  });
  lines.push("", "线索（" + state.clues.length + " 条）");
  if (!state.clues.length) lines.push("（无）");
  state.clues.forEach(c => lines.push("· " + c));
  const polls = ch.pages.filter(p => p.type === "poll");
  if (polls.length) {
    lines.push("", "我留下的倾向（不计分）");
    polls.forEach(p => {
      const r = state.polls[p.pid];
      lines.push("· " + p.title + " → " + (r && r.choice >= 0 ? p.options[r.choice].t : "未记录"));
    });
  }
  lines.push("", "— 由《迷雾中的证据》本机生成，进度只保存在这个浏览器里");
  return lines.join("\n");
}

function showExport() {
  const ov = el("div", "modal");
  const box = el("div", "modalbox");
  box.appendChild(el("h3", "", "成绩与线索"));
  const ta = document.createElement("textarea");
  ta.value = exportText(); ta.readOnly = true; ta.rows = 16;
  box.appendChild(ta);
  const row = el("div", "acts");
  const cp = el("button", "primary", "复制到剪贴板");
  cp.onclick = () => {
    const done = () => toast("已复制到剪贴板");
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand("copy"); done(); });
      } else { ta.select(); document.execCommand("copy"); done(); }
    } catch (e) { toast("请手动全选复制"); }
  };
  const cl = el("button", "ghost", "关闭");
  cl.onclick = () => ov.remove();
  row.appendChild(cp); row.appendChild(cl);
  box.appendChild(row);
  ov.appendChild(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
  ta.focus(); ta.select();
}

/* ---------- 顶栏与音频开关 ---------- */
function bindChrome() {
  const p = loadPrefs();
  if (p) {
    Audio_.prefs.music = p.music; Audio_.prefs.sfx = p.sfx; Audio_.prefs.volume = p.volume;
    if (typeof p.simple === "boolean") Audio_.prefs.simple = p.simple;
  }
  $("#mMusic").checked = Audio_.prefs.music;
  $("#mSfx").checked = Audio_.prefs.sfx;
  $("#mSimple").checked = !!Audio_.prefs.simple;
  $("#vol").value = Math.round(Audio_.prefs.volume * 100);

  $("#mMusic").onchange = e => {
    Audio_.prefs.music = e.target.checked; savePrefs(Audio_.prefs);
    if (!Audio_.ready) return;
    const t = Audio_.ctx.currentTime;
    Audio_.musicGain.gain.cancelScheduledValues(t);
    Audio_.musicGain.gain.linearRampToValueAtTime(e.target.checked ? 0.85 : 0.0001, t + 0.5);
    if (e.target.checked) Audio_.startMusic();
  };
  $("#mSfx").onchange = e => {
    Audio_.prefs.sfx = e.target.checked; savePrefs(Audio_.prefs);
    if (Audio_.ready) Audio_.sfxGain.gain.value = e.target.checked ? 0.9 : 0.0001;
  };
  $("#mSimple").onchange = e => {
    Audio_.prefs.simple = e.target.checked; savePrefs(Audio_.prefs);
    if (!state) return;
    state.simple = e.target.checked;
    const t = page().type;
    if (state.simple && (t === "poll" || t === "recall")) nextPage();
    else renderPage(true);
  };
  $("#vol").oninput = e => {
    Audio_.prefs.volume = e.target.value / 100; savePrefs(Audio_.prefs);
    if (Audio_.ready) Audio_.master.gain.value = Audio_.prefs.volume;
  };
  $("#nbBtn").onclick = () => openDrawer(!$("#drawer").classList.contains("open"));
  $("#expBtn").onclick = () => showExport();
  $("#scrim").onclick = () => openDrawer(false);
  $("#quitBtn").onclick = () => { renderShelf(); showScreen("shelf"); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") { openDrawer(false); const m = document.querySelector(".modal"); if (m) m.remove(); } });
}

/* ---------- 强度表 ---------- */
function meterLoop() {
  const m = Audio_.mood();
  $("#mBright").style.width = Math.round(m.brightness * 100) + "%";
  $("#mTens").style.width = Math.round(m.tension * 100) + "%";
  requestAnimationFrame(meterLoop);
}

/* ---------- 启动 ---------- */
bindChrome();
renderShelf();
showScreen("shelf");
meterLoop();
window.__app = {
  state: () => state,
  chapter: () => (state ? chapter() : null),
  page: () => (state ? page() : null),
  audio: Audio_,
  chapters: () => CHAPTERS,
  artKeys: () => Object.keys(ART),
  base: () => Audio_.base,
  exportText: () => exportText(),
  go: id => startChapter(id, null)
};
</script>
